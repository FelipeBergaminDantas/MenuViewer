name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Testes do backend e acessibilidade
        run: pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Testes do interpretador de voz
        run: npm test

      - name: Migrations em sincronia com os modelos
        env:
          FLASK_APP: run.py
          FLASK_CONFIG: production
          SECRET_KEY: chave-somente-para-o-ci
          DATABASE_URL: sqlite:////tmp/ci.db
        run: |
          flask db upgrade
          flask db check
