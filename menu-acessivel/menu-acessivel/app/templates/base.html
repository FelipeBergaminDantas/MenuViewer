<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Cardápio Acessível{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/high-contrast.css') }}" id="high-contrast-sheet" disabled>
</head>
<body>

    <a href="#conteudo-principal" class="skip-link">Pular para o conteúdo</a>

    <header class="a11y-bar" role="toolbar" aria-label="Opções de acessibilidade">
        <div class="a11y-group" aria-label="Tamanho da fonte">
            <span class="a11y-label">Fonte</span>
            <button type="button" id="btn-font-decrease" aria-label="Diminuir tamanho da fonte">A-</button>
            <button type="button" id="btn-font-reset" aria-label="Tamanho de fonte padrão">A</button>
            <button type="button" id="btn-font-increase" aria-label="Aumentar tamanho da fonte">A+</button>
        </div>

        <div class="a11y-group">
            <button type="button" id="btn-contrast" aria-pressed="false">Alto contraste</button>
        </div>

        <div class="a11y-group">
            <button type="button" id="btn-reduce-motion" aria-pressed="false">Reduzir movimento</button>
        </div>

        <div class="a11y-group" aria-label="Idioma">
            <button type="button" class="flag-btn" data-lang="pt" aria-label="Português">🇧🇷</button>
            <button type="button" class="flag-btn" data-lang="en" aria-label="English">🇺🇸</button>
            <button type="button" class="flag-btn" data-lang="es" aria-label="Español">🇪🇸</button>
        </div>
    </header>

    <main id="conteudo-principal">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/font-size.js') }}"></script>
    <script src="{{ url_for('static', filename='js/contrast.js') }}"></script>
    <script src="{{ url_for('static', filename='js/reduce-motion.js') }}"></script>
    <script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
    <script src="{{ url_for('static', filename='js/zoom.js') }}"></script>
</body>
</html>
